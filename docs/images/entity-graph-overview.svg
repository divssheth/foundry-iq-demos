<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" width="1280" height="790" role="img" aria-labelledby="title desc">
  <title id="title">Entity graph: from articles to answers</title>
  <desc id="desc">Four steps: Wikipedia articles in Blob storage, an ontology that defines entity types and relationships, LLM extraction of triples, and a graph index of nodes and edges. Changing the ontology replays the ingestion cache so only extraction reruns. Example path: Yuri Gagarin crewOf Vostok 1 launchedFrom Baikonur Cosmodrome locatedIn Kazakhstan. The graph is used through a knowledge base in plain language or directly with GQL.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9AA3B5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #1F2430; }
      .subtitle { font-size: 18px; fill: #5B6272; }
      .h { font-size: 22px; font-weight: 700; fill: #1F2430; }
      .h2 { font-size: 20px; font-weight: 700; fill: #1F2430; }
      .section { font-size: 18px; font-weight: 700; fill: #1F2430; }
      .body { font-size: 16px; fill: #5B6272; }
      .small { font-size: 15px; fill: #5B6272; }
      .num { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .edge { font-size: 13px; font-weight: 600; fill: #5B6272; }
      .pill { font-size: 15px; font-weight: 600; }
      .card { fill: #FFFFFF; stroke-width: 2; }
      .conn { stroke: #9AA3B5; stroke-width: 2.5; fill: none; }
      .icon { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background panel: keeps the image readable on light and dark themes -->
  <rect x="0" y="0" width="1280" height="790" rx="28" fill="#F7F8FC"/>

  <!-- Title -->
  <text class="title" x="64" y="80">Entity graph: from articles to answers</text>
  <text class="subtitle" x="64" y="114">Foundry IQ turns documents into connected facts that can be followed across articles</text>

  <!-- Card 1: Articles (blue) -->
  <g>
    <rect class="card" x="64" y="150" width="264" height="240" rx="20" stroke="#C9D8F7"/>
    <circle cx="104" cy="190" r="18" fill="#3B6FD8"/>
    <text class="num" x="104" y="196" text-anchor="middle">1</text>
    <circle cx="280" cy="190" r="24" fill="#E8F0FE"/>
    <g class="icon" stroke="#3B6FD8">
      <rect x="272" y="179" width="16" height="22" rx="3"/>
      <path d="M276 186 H284 M276 191 H284 M276 196 H281"/>
    </g>
    <text class="h" x="88" y="260">Articles</text>
    <text class="body" x="88" y="292">57 Wikipedia pages<tspan x="88" dy="24">in the space-entity</tspan><tspan x="88" dy="24">Blob container</tspan></text>
  </g>

  <!-- Card 2: Ontology (purple) -->
  <g>
    <rect class="card" x="360" y="150" width="264" height="240" rx="20" stroke="#DCD2F7"/>
    <circle cx="400" cy="190" r="18" fill="#7B5BD6"/>
    <text class="num" x="400" y="196" text-anchor="middle">2</text>
    <circle cx="576" cy="190" r="24" fill="#F0EBFD"/>
    <g class="icon" stroke="#7B5BD6">
      <path d="M576 185 L569 196 M576 185 L583 196 M572 199 H580"/>
      <circle cx="576" cy="182" r="3"/>
      <circle cx="568" cy="199" r="3"/>
      <circle cx="584" cy="199" r="3"/>
    </g>
    <text class="h" x="384" y="260">Ontology</text>
    <text class="body" x="384" y="292">JSON-LD that names<tspan x="384" dy="24">the entity types and</tspan><tspan x="384" dy="24">relationships to extract</tspan></text>
  </g>

  <!-- Card 3: Extraction (amber) -->
  <g>
    <rect class="card" x="656" y="150" width="264" height="240" rx="20" stroke="#F5DDB0"/>
    <circle cx="696" cy="190" r="18" fill="#D98E1C"/>
    <text class="num" x="696" y="196" text-anchor="middle">3</text>
    <circle cx="872" cy="190" r="24" fill="#FFF4E0"/>
    <path class="icon" stroke="#D98E1C" d="M872 179 L875 187 L883 190 L875 193 L872 201 L869 193 L861 190 L869 187 Z"/>
    <text class="h" x="680" y="260">Extraction</text>
    <text class="body" x="680" y="292">An LLM reads every<tspan x="680" dy="24">chunk and writes</tspan><tspan x="680" dy="24">subject → relation → object</tspan></text>
  </g>

  <!-- Card 4: Graph index (green) -->
  <g>
    <rect class="card" x="952" y="150" width="264" height="240" rx="20" stroke="#C3E8D5"/>
    <circle cx="992" cy="190" r="18" fill="#2E9E6A"/>
    <text class="num" x="992" y="196" text-anchor="middle">4</text>
    <circle cx="1168" cy="190" r="24" fill="#E6F6EE"/>
    <g class="icon" stroke="#2E9E6A">
      <path d="M1159 184 L1176 181 M1159 184 L1170 199 M1176 181 L1170 199 M1161 198 L1170 199"/>
      <circle cx="1159" cy="184" r="3" fill="#2E9E6A"/>
      <circle cx="1176" cy="181" r="3" fill="#2E9E6A"/>
      <circle cx="1170" cy="199" r="3" fill="#2E9E6A"/>
      <circle cx="1161" cy="198" r="3" fill="#2E9E6A"/>
    </g>
    <text class="h" x="976" y="260">Graph index</text>
    <text class="body" x="976" y="292">Entities become nodes,<tspan x="976" dy="24">relationships become</tspan><tspan x="976" dy="24">edges you can traverse</tspan></text>
  </g>

  <!-- Connectors between cards -->
  <path class="conn" d="M330 270 H356" marker-end="url(#arrow)"/>
  <path class="conn" d="M626 270 H652" marker-end="url(#arrow)"/>
  <path class="conn" d="M922 270 H948" marker-end="url(#arrow)"/>

  <!-- Callout: ontology change replays the cache -->
  <g>
    <rect x="360" y="414" width="856" height="56" rx="16" fill="#FFF4E0" stroke="#D98E1C" stroke-width="2" stroke-dasharray="7 6"/>
    <g class="icon" stroke="#D98E1C">
      <path d="M398 436 A11 11 0 1 0 399 450"/>
      <path d="M392 434 L398 436 L397 442"/>
    </g>
    <text class="body" x="416" y="448"><tspan font-weight="700" fill="#1F2430">Change the ontology (v1 → v2):</tspan> the ingestion cache replays chunks and embeddings, so only extraction reruns</text>
  </g>

  <!-- Example strip -->
  <g>
    <rect x="64" y="494" width="1152" height="80" rx="20" fill="#FFFFFF" stroke="#E3E6EE" stroke-width="2"/>
    <text class="section" x="88" y="528" font-size="16px">Example path</text>
    <text class="small" x="88" y="550">ontology v2</text>

    <rect x="300" y="514" width="140" height="40" rx="20" fill="#E8F0FE"/>
    <text class="pill" x="370" y="539" text-anchor="middle" fill="#2A56B5">Yuri Gagarin</text>

    <path class="conn" d="M444 534 H546" marker-end="url(#arrow)"/>
    <text class="edge" x="495" y="524" text-anchor="middle">crewOf</text>

    <rect x="550" y="514" width="104" height="40" rx="20" fill="#FFF4E0"/>
    <text class="pill" x="602" y="539" text-anchor="middle" fill="#A76508">Vostok 1</text>

    <path class="conn" d="M658 534 H790" marker-end="url(#arrow)"/>
    <text class="edge" x="724" y="524" text-anchor="middle">launchedFrom</text>

    <rect x="794" y="514" width="203" height="40" rx="20" fill="#FDECEC"/>
    <text class="pill" x="895" y="539" text-anchor="middle" fill="#B23B37">Baikonur Cosmodrome</text>

    <path class="conn" d="M1001 534 H1090" marker-end="url(#arrow)"/>
    <text class="edge" x="1045" y="524" text-anchor="middle">locatedIn</text>

    <rect x="1094" y="514" width="110" height="40" rx="20" fill="#F0EBFD"/>
    <text class="pill" x="1149" y="539" text-anchor="middle" fill="#5D3FB8">Kazakhstan</text>
  </g>

  <!-- Two ways to use the graph -->
  <text class="section" x="64" y="616">Two ways to use the graph</text>

  <g>
    <rect class="card" x="64" y="632" width="560" height="110" rx="20" stroke="#C3E8D5"/>
    <circle cx="112" cy="687" r="26" fill="#E6F6EE"/>
    <g class="icon" stroke="#2E9E6A">
      <path d="M100 677 H124 A3 3 0 0 1 127 680 V693 A3 3 0 0 1 124 696 H110 L103 702 V696 H100 A3 3 0 0 1 97 693 V680 A3 3 0 0 1 100 677 Z"/>
    </g>
    <text class="h2" x="156" y="676">Ask in plain language</text>
    <text class="small" x="156" y="704">The knowledge base writes GQL from the question and<tspan x="156" dy="22">returns graph rows or a cited, written answer</tspan></text>
  </g>

  <g>
    <rect class="card" x="656" y="632" width="560" height="110" rx="20" stroke="#DCD2F7"/>
    <circle cx="704" cy="687" r="26" fill="#F0EBFD"/>
    <g class="icon" stroke="#7B5BD6">
      <path d="M697 679 L689 687 L697 695 M711 679 L719 687 L711 695 M706 677 L702 697"/>
    </g>
    <text class="h2" x="748" y="676">Query directly with GQL</text>
    <text class="small" x="748" y="704">SearchClient.graph runs your own MATCH query and<tspan x="748" dy="22">returns rows with provenance to source passages</tspan></text>
  </g>
</svg>
