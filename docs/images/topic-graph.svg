<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" width="1280" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Topic graph: answer the big-picture questions</title>
  <desc id="desc">Chunk vectors from the space-exploration index are linked to their nearest neighbours, grouped into a hierarchy of topics by community detection and named by an LLM, then stored as a topic index linked to the text_vector field. It is built client-side by the Foundry IQ skills plugin. At query time the knowledge source's topic_graph setting is none, balanced or diverse.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9AA3B5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #1F2430; }
      .subtitle { font-size: 18px; fill: #5B6272; }
      .h { font-size: 22px; font-weight: 700; fill: #1F2430; }
      .h2 { font-size: 20px; font-weight: 700; fill: #1F2430; }
      .section { font-size: 18px; font-weight: 700; fill: #1F2430; }
      .tag { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
      .body { font-size: 16px; fill: #5B6272; }
      .small { font-size: 15px; fill: #5B6272; }
      .num { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .edge { font-size: 13px; font-weight: 600; fill: #5B6272; }
      .pill { font-size: 15px; font-weight: 600; }
      .card { fill: #FFFFFF; stroke-width: 2; }
      .conn { stroke: #9AA3B5; stroke-width: 2.5; fill: none; }
      .icon { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background panel: keeps the image readable on light and dark themes -->
  <rect x="0" y="0" width="1280" height="650" rx="28" fill="#F7F8FC"/>

  <text class="title" x="64" y="80">Topic graph: answer the big-picture questions</text>
  <text class="subtitle" x="64" y="114">Group chunks into named themes so broad questions draw evidence from across the whole collection</text>

  <g>
    <rect class="card" x="64" y="150" width="264" height="220" rx="20" stroke="#C9D8F7"/>
    <circle cx="104" cy="190" r="18" fill="#3B6FD8"/>
    <text class="num" x="104" y="196" text-anchor="middle">1</text>
    <circle cx="280" cy="190" r="24" fill="#E8F0FE"/>
    <g class="icon" stroke="#3B6FD8"><ellipse cx="280" cy="183" rx="9" ry="3.5"/><path d="M271 183 V197 A9 3.5 0 0 0 289 197 V183 M271 190 A9 3.5 0 0 0 289 190"/></g>
    <text class="h" x="88" y="258">Chunk vectors</text>
    <text class="body" x="88" y="290">from the<tspan x="88" dy="24">space-exploration</tspan><tspan x="88" dy="24">index (text_vector)</tspan></text>
  </g>

  <g>
    <rect class="card" x="360" y="150" width="264" height="220" rx="20" stroke="#F5DDB0"/>
    <circle cx="400" cy="190" r="18" fill="#D98E1C"/>
    <text class="num" x="400" y="196" text-anchor="middle">2</text>
    <circle cx="576" cy="190" r="24" fill="#FFF4E0"/>
    <g class="icon" stroke="#D98E1C"><path d="M567 184 L584 181 M567 184 L578 199 M584 181 L578 199 M569 198 L578 199"/><circle cx="567" cy="184" r="3" fill="#D98E1C"/><circle cx="584" cy="181" r="3" fill="#D98E1C"/><circle cx="578" cy="199" r="3" fill="#D98E1C"/><circle cx="569" cy="198" r="3" fill="#D98E1C"/></g>
    <text class="h" x="384" y="258">Similarity graph</text>
    <text class="body" x="384" y="290">each chunk linked<tspan x="384" dy="24">to its nearest</tspan><tspan x="384" dy="24">neighbours</tspan></text>
  </g>

  <g>
    <rect class="card" x="656" y="150" width="264" height="220" rx="20" stroke="#F5DDB0"/>
    <circle cx="696" cy="190" r="18" fill="#D98E1C"/>
    <text class="num" x="696" y="196" text-anchor="middle">3</text>
    <circle cx="872" cy="190" r="24" fill="#FFF4E0"/>
    <g class="icon" stroke="#D98E1C"><circle cx="866" cy="185" r="4"/><circle cx="878" cy="185" r="4"/><circle cx="872" cy="196" r="4"/><path d="M870 185 H874 M868 189 L870 193 M876 189 L874 193"/></g>
    <text class="h" x="680" y="258">Topics</text>
    <text class="body" x="680" y="290">community detection<tspan x="680" dy="24">builds a hierarchy;</tspan><tspan x="680" dy="24">an LLM names topics</tspan></text>
  </g>

  <g>
    <rect class="card" x="952" y="150" width="264" height="220" rx="20" stroke="#C3E8D5"/>
    <circle cx="992" cy="190" r="18" fill="#2E9E6A"/>
    <text class="num" x="992" y="196" text-anchor="middle">4</text>
    <circle cx="1168" cy="190" r="24" fill="#E6F6EE"/>
    <g class="icon" stroke="#2E9E6A"><path d="M1168 181 L1178 186 L1168 191 L1158 186 Z M1158 192 L1168 197 L1178 192"/></g>
    <text class="h" x="976" y="258">Topic index</text>
    <text class="body" x="976" y="290">one centroid per<tspan x="976" dy="24">topic, linked to</tspan><tspan x="976" dy="24">text_vector by a profile</tspan></text>
  </g>

  <path class="conn" d="M330 260 L356 260" marker-end="url(#arrow)"/>
  <path class="conn" d="M626 260 L652 260" marker-end="url(#arrow)"/>
  <path class="conn" d="M922 260 L948 260" marker-end="url(#arrow)"/>

  <g>
    <rect x="360" y="394" width="856" height="56" rx="16" fill="#FFF4E0" stroke="#D98E1C" stroke-width="2" stroke-dasharray="7 6"/>
    <g class="icon" stroke="#D98E1C"><circle cx="390" cy="422" r="10"/><path d="M390 418 V423 M390 427 V427.5"/></g>
    <text class="body" x="416" y="428"><tspan font-weight="700" fill="#1F2430">Built client-side:</tspan> the Foundry IQ skills plugin runs topic-graph-build; there's no server-side builder</text>
  </g>

  <text class="section" x="64" y="490">Query-time setting: topic_graph</text>

  <g>
    <rect class="card" x="64" y="506" width="362" height="96" rx="20" stroke="#C9D8F7"/>
    <circle cx="112" cy="554" r="26" fill="#E8F0FE"/>
    <g class="icon" stroke="#3B6FD8"><circle cx="110" cy="552" r="7"/><path d="M115 557 L121 563"/></g>
    <text class="h2" x="160" y="550">none</text>
    <text class="small" x="160" y="578">closest chunks only</text>
  </g>

  <g>
    <rect class="card" x="459" y="506" width="362" height="96" rx="20" stroke="#DCD2F7"/>
    <circle cx="507" cy="554" r="26" fill="#F0EBFD"/>
    <g class="icon" stroke="#7B5BD6"><circle cx="501" cy="549" r="4"/><circle cx="513" cy="549" r="4"/><circle cx="507" cy="560" r="4"/><path d="M505 549 H509 M503 553 L505 557 M511 553 L509 557"/></g>
    <text class="h2" x="555" y="550">balanced</text>
    <text class="small" x="555" y="578">evidence spread across topics</text>
  </g>

  <g>
    <rect class="card" x="854" y="506" width="362" height="96" rx="20" stroke="#C3E8D5"/>
    <circle cx="902" cy="554" r="26" fill="#E6F6EE"/>
    <g class="icon" stroke="#2E9E6A"><path d="M902 543 L905 551 L913 554 L905 557 L902 565 L899 557 L891 554 L899 551 Z"/></g>
    <text class="h2" x="950" y="550">diverse</text>
    <text class="small" x="950" y="578">widest coverage of themes</text>
  </g>
</svg>
