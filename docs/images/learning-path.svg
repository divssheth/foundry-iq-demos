<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Foundry IQ learning path</title>
  <desc id="desc">Two tracks. Basics, with NASA Earth at Night and Microsoft Learn: 1 knowledge layer, 2 agent via MCP. Space exploration on Wikipedia: 0 prepare the dataset, 3 Microsoft Retriever 1, 4 topic graph, 5 entity graph.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9AA3B5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #1F2430; }
      .subtitle { font-size: 18px; fill: #5B6272; }
      .h { font-size: 22px; font-weight: 700; fill: #1F2430; }
      .h2 { font-size: 20px; font-weight: 700; fill: #1F2430; }
      .section { font-size: 18px; font-weight: 700; fill: #1F2430; }
      .tag { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
      .body { font-size: 16px; fill: #5B6272; }
      .small { font-size: 15px; fill: #5B6272; }
      .num { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .edge { font-size: 13px; font-weight: 600; fill: #5B6272; }
      .pill { font-size: 15px; font-weight: 600; }
      .card { fill: #FFFFFF; stroke-width: 2; }
      .conn { stroke: #9AA3B5; stroke-width: 2.5; fill: none; }
      .icon { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background panel: keeps the image readable on light and dark themes -->
  <rect x="0" y="0" width="1280" height="600" rx="28" fill="#F7F8FC"/>

  <text class="title" x="64" y="80">Foundry IQ learning path</text>
  <text class="subtitle" x="64" y="114">From knowledge-base basics to Microsoft Retriever 1, topic graphs and entity graphs</text>

  <text class="section" x="64" y="164">01-basics · NASA Earth at Night + Microsoft Learn</text>

  <g>
    <rect class="card" x="64" y="180" width="560" height="150" rx="20" stroke="#C9D8F7"/>
    <circle cx="104" cy="220" r="18" fill="#3B6FD8"/>
    <text class="num" x="104" y="226" text-anchor="middle">1</text>
    <circle cx="576" cy="220" r="24" fill="#E8F0FE"/>
    <g class="icon" stroke="#3B6FD8"><path d="M576 211 L586 216 L576 221 L566 216 Z M566 222 L576 227 L586 222"/></g>
    <text class="h" x="88" y="268">Knowledge layer</text>
    <text class="body" x="88" y="296">index + MCP knowledge sources, one knowledge base</text>
  </g>

  <g>
    <rect class="card" x="656" y="180" width="560" height="150" rx="20" stroke="#C3E8D5"/>
    <circle cx="696" cy="220" r="18" fill="#2E9E6A"/>
    <text class="num" x="696" y="226" text-anchor="middle">2</text>
    <circle cx="1168" cy="220" r="24" fill="#E6F6EE"/>
    <g class="icon" stroke="#2E9E6A"><rect x="1158" y="213" width="20" height="15" rx="4"/><path d="M1168 213 V209"/><circle cx="1168" cy="208" r="1.5"/><path d="M1164 220 V221 M1172 220 V221"/></g>
    <text class="h" x="680" y="268">Agent via MCP</text>
    <text class="body" x="680" y="296">a Foundry agent that answers with citations</text>
  </g>

  <path class="conn" d="M626 255 L652 255" marker-end="url(#arrow)"/>

  <text class="section" x="64" y="378">Space exploration · Wikipedia</text>

  <g>
    <rect class="card" x="64" y="394" width="264" height="170" rx="20" stroke="#F5DDB0"/>
    <circle cx="104" cy="434" r="18" fill="#D98E1C"/>
    <text class="num" x="104" y="440" text-anchor="middle">0</text>
    <circle cx="280" cy="434" r="24" fill="#FFF4E0"/>
    <g class="icon" stroke="#D98E1C"><path d="M280 440 V425 M274 431 L280 425 L286 431 M270 439 V444 H290 V439"/></g>
    <text class="h" x="88" y="482">Prepare data</text>
    <text class="body" x="88" y="510">run once: blob,<tspan x="88" dy="24">pipeline, index</tspan></text>
  </g>

  <g>
    <rect class="card" x="360" y="394" width="264" height="170" rx="20" stroke="#DCD2F7"/>
    <circle cx="400" cy="434" r="18" fill="#7B5BD6"/>
    <text class="num" x="400" y="440" text-anchor="middle">3</text>
    <circle cx="576" cy="434" r="24" fill="#F0EBFD"/>
    <g class="icon" stroke="#7B5BD6"><path d="M578 423 L570 436 H576 L574 445 L582 432 H576 Z"/></g>
    <text class="h" x="384" y="482">Retriever 1</text>
    <text class="body" x="384" y="510">planning hosted<tspan x="384" dy="24">in Foundry IQ</tspan></text>
  </g>

  <g>
    <rect class="card" x="656" y="394" width="264" height="170" rx="20" stroke="#C9D8F7"/>
    <circle cx="696" cy="434" r="18" fill="#3B6FD8"/>
    <text class="num" x="696" y="440" text-anchor="middle">4</text>
    <circle cx="872" cy="434" r="24" fill="#E8F0FE"/>
    <g class="icon" stroke="#3B6FD8"><circle cx="866" cy="429" r="4"/><circle cx="878" cy="429" r="4"/><circle cx="872" cy="440" r="4"/><path d="M870 429 H874 M868 433 L870 437 M876 433 L874 437"/></g>
    <text class="h" x="680" y="482">Topic graph</text>
    <text class="body" x="680" y="510">themes across<tspan x="680" dy="24">the collection</tspan></text>
  </g>

  <g>
    <rect class="card" x="952" y="394" width="264" height="170" rx="20" stroke="#C3E8D5"/>
    <circle cx="992" cy="434" r="18" fill="#2E9E6A"/>
    <text class="num" x="992" y="440" text-anchor="middle">5</text>
    <circle cx="1168" cy="434" r="24" fill="#E6F6EE"/>
    <g class="icon" stroke="#2E9E6A"><path d="M1159 428 L1176 425 M1159 428 L1170 443 M1176 425 L1170 443 M1161 442 L1170 443"/><circle cx="1159" cy="428" r="3" fill="#2E9E6A"/><circle cx="1176" cy="425" r="3" fill="#2E9E6A"/><circle cx="1170" cy="443" r="3" fill="#2E9E6A"/><circle cx="1161" cy="442" r="3" fill="#2E9E6A"/></g>
    <text class="h" x="976" y="482">Entity graph</text>
    <text class="body" x="976" y="510">follow relationships<tspan x="976" dy="24">across articles</tspan></text>
  </g>

  <path class="conn" d="M330 479 L356 479" marker-end="url(#arrow)"/>
  <path class="conn" d="M626 479 L652 479" marker-end="url(#arrow)"/>
  <path class="conn" d="M922 479 L948 479" marker-end="url(#arrow)"/>
</svg>
